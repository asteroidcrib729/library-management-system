[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "library-management-system"
version = "0.1.0"
description = "A modular, object-oriented library management system."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi>=25.1.0,<26.0",
    "fastapi>=0.141.1,<0.142.0",
    "prompt-toolkit>=3.0.52,<4.0",
    "psycopg[binary]>=3.3,<3.4",
    "psycopg-pool>=3.3,<3.4",
    "rich>=14.1.0,<15.0",
    "uvicorn>=0.52.4,<0.53.0",
]

[project.optional-dependencies]
development = [
    "httpx2>=2.12.0,<3.0",
    "pyrefly>=1.2.0,<2.0",
    "pytest>=8.4.1,<10.0",
    "ruff>=0.12.0,<1.0",
]

[project.scripts]
lms = "library_management.main:main"
lms-api = "library_management.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["postgres: requires an explicitly configured disposable PostgreSQL test database"]

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
search-path = ["src", "."]
python-version = "3.14"
preset = "strict"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
